# nginx config for the Antrian Mini PC (Windows).
#
# Assumed install paths (change them here AND in start-server.bat if different):
#   C:\antrian   this repository
#   C:\nginx     nginx for Windows (zip from nginx.org)
#
# start-server.bat runs nginx with:  -p C:/nginx/ -c C:/antrian/deploy/windows/nginx.conf
# so a `git pull` updates this file in place; no copying needed.

worker_processes 1;

error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      C:/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Every screen polls /…/state every 3 seconds; an access log would grow by
    # ~100k lines a day with no rotation on Windows. Errors still go to error.log.
    access_log off;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    # Branding logo upload allows up to 2 MB (BrandingRequest); leave headroom.
    client_max_body_size 10m;

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Four php-cgi processes started by start-server.bat (PHP_PORTS there).
    # php-cgi serves one request at a time, so nginx spreads load across them.
    upstream php {
        server 127.0.0.1:9000;
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
    }

    server {
        listen      80 default_server;
        server_name _;

        root  C:/antrian/public;
        index index.php;
        charset utf-8;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Vite output has hashed file names, so it can be cached for long.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { log_not_found off; }
        location = /robots.txt  { log_not_found off; }

        error_page 404 /index.php;

        location ~ ^/index\.php(/|$) {
            include       C:/nginx/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass  php;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;

            # Laravel's Vite preload "Link" header plus cookies exceed nginx's
            # default 4k header buffer, which would make every page a 502.
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        # Block .env, .git and other dotfiles.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
